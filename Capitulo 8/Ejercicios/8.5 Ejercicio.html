<!DOCTYPE html>
<!-- Ejercicio 8.9 -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Gráfico de barras</title>
      <script>
         for ( var i = 1; i <= 5; i++ )
         {
            var n = parseInt( window.prompt( "Escriba un número entre 1 y 30 (" + i + " de 5):" ) );
            document.write( "<p>" );
            for ( var j = 0; j < n; j++ )
               document.write( "*" );
            document.writeln( "</p>" );
         }
      </script>
   </head><body></body>
</html>
