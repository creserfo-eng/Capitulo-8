<!DOCTYPE html>
<!-- Ejercicio 8.7 -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Producto de impares</title>
      <script>
         var producto = 1;

         for ( var i = 1; i <= 15; i += 2 )
            producto *= i;

         document.writeln( "<h1>El producto de los enteros impares del 1 al 15 es: " + producto + "</h1>" );
      </script>
   </head><body></body>
</html>
